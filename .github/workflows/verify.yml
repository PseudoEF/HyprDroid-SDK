name: SDK verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lua5.4 openssl
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-lua54 mingw-w64-ucrt-x86_64-openssl
      - if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cygpath -w /ucrt64/bin >> "$GITHUB_PATH"
      - run: python -m pip install . build
      - run: hyp doctor
      - run: python -m unittest discover -s tests -v
      - run: python tools/check-core.py
      - run: python -m build
      - if: runner.os == 'Linux' && matrix.python == '3.11'
        run: cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS
      - if: runner.os == 'Linux' && matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: sdk-distributions
          path: dist/*
          if-no-files-found: error
